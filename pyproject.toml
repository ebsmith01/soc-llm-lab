[project]
name = "secure-rag-assistant"
version = "0.1.0"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "numpy",
  "pandas",
  "scikit-learn",
  "rank-bm25",
  "faiss-cpu; platform_system != 'Windows'",
  "psycopg[binary]",
  "pgvector",
  "sentence-transformers",
  "transformers",
  "accelerate",
  "evaluate",
  "langchain-community",
  "langchain-experimental",
  "langchain-huggingface",
  "pypdf",
  "docx2txt",
  "beautifulsoup4",
  "openai",
  "prometheus-client",
  "structlog",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-fastapi",
  "python-dotenv",
  "pytest"
]

[tool.setuptools]
packages = ["rag", "service", "storage", "scripts", "libs"]
