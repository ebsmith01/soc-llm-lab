[loggers]
keys = root, uvicorn, api, rag

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = INFO
handlers = console

[logger_uvicorn]
level = INFO
handlers = console
qualname = uvicorn
propagate = 1

[logger_api]
level = INFO
handlers = console
qualname = service.api
propagate = 1

[logger_rag]
level = INFO
handlers = console
qualname = rag
propagate = 1

[handler_console]
class = StreamHandler
level = INFO
formatter = standard
args = (sys.stdout,)

[formatter_standard]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S